<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <title>Noor — Read, listen and memorise the Quran</title>
    <meta
      name="description"
      content="A calm Quran companion: accurate mushaf fonts, translations, recitations, memorisation and prayer times. Works offline."
    />
    <meta
      name="keywords"
      content="Quran, Mushaf, Tajweed, Hifz, Prayer Times, Islam, Arabic, Recitation"
    />

    <meta
      name="theme-color"
      content="#faf6ef"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0d0c0b"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Noor" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Noor" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://noorquran.app/" />
    <meta
      property="og:title"
      content="Noor — Read, listen and memorise the Quran"
    />
    <meta
      property="og:description"
      content="Accurate mushaf fonts, translations, recitations, memorisation and prayer times. Works offline."
    />
    <meta property="og:image" content="https://noorquran.app/og-image.png" />
    <meta property="og:site_name" content="Noor" />
    <meta name="twitter:card" content="summary_large_image" />

    <link
      rel="preload"
      href="/fonts/quran/hafs/uthmanic_hafs/UthmanicHafs1Ver18.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- Apply theme and text direction before first paint (no flash). -->
    <script>
      (function () {
        try {
          var prefs =
            JSON.parse(localStorage.getItem("noor-preferences") || "{}")
              .state || {};
          var theme = prefs.theme || localStorage.getItem("theme") || "system";
          var dark =
            theme === "dark" ||
            (theme === "system" &&
              matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          var lang = prefs.language === "ar" ? "ar" : "en";
          document.documentElement.lang = lang;
          document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
